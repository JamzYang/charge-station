version: '3.8'

services:
  # PostgreSQL服务（PostGIS扩展）- 开发环境
  postgres-dev:
    image: postgis/postgis:15-3.3-alpine
    container_name: postgres-dev-station
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: charge_station
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d charge_station"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis服务 - 开发环境
  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev-station
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Zookeeper服务 - 开发环境
  zookeeper-dev:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-dev-station
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafka服务 - 开发环境
  kafka-dev:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-dev-station
    depends_on:
      zookeeper-dev:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-dev:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-dev:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 1048576
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka-dev:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
