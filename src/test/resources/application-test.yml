spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  # 数据库和缓存配置由Testcontainers的@ServiceConnection自动配置
  
  # Kafka配置由Testcontainers的@ServiceConnection自动配置
  
  flyway:
    enabled: false

logging:
  level:
    com.charge.station: DEBUG
    org.springframework.kafka: WARN
