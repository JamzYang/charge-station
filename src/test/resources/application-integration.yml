spring:
  # 数据源配置 - 连接到Docker容器中的PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/station_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop  # 测试时重新创建表结构
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # Redis配置 - 连接到Docker容器中的Redis
  # 注意：如果网关服务已运行，会自动连接到网关的Redis服务
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms

  # Kafka配置 - 连接到Docker容器中的Kafka
  # 注意：如果网关服务已运行，会自动连接到网关的Kafka服务
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: station-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.charge.station"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    listener:
      ack-mode: manual_immediate

  # Flyway配置 - 测试时禁用
  flyway:
    enabled: false

# Redisson配置 - 连接到Docker容器中的Redis
redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379"
      connectionPoolSize: 10
      connectionMinimumIdleSize: 2
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500

# 日志配置
logging:
  level:
    com.charge.station: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
