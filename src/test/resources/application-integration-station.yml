# 充电站应用服务集成测试配置
spring:
  # 数据源配置 - 连接到Docker容器中的PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/station_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop  # 测试时重新创建表结构
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Redis配置 - 连接到Docker容器中的Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 1  # 使用不同的数据库避免冲突
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms

  # Kafka配置 - 连接到Docker容器中的Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: station-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.charge.station"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    listener:
      ack-mode: manual_immediate

  # Flyway配置 - 禁用以避免与Hibernate冲突
  flyway:
    enabled: false

# 日志配置
logging:
  level:
    com.charge.station: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG

# 应用配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 测试专用配置
test:
  # 测试数据配置
  data:
    cleanup:
      enabled: true
      timeout: 30s
  
  # 测试环境检查配置
  environment:
    check:
      enabled: true
      timeout: 10s
      retry-count: 3
