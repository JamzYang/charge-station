# 开发环境配置
spring:
  # 数据源配置 - 使用测试环境的PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/charge_station
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: false
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Redis配置 - 开发环境无密码
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms


# 日志配置
logging:
  level:
    com.charge.station: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 应用自定义配置
app:
  kafka:
    topics:
      ocpp-events-up: ocpp-events-up-local
      commands-down: commands-down-local
    partitions:
      total: 3
  cache:
    ttl:
      station-detail: 1800  # 30分钟
      chargepoint-status: 60  # 1分钟