version: '3.8'

services:
  # PostgreSQL服务（PostGIS扩展）- Station服务专用
  postgres-test:
    image: postgis/postgis:15-3.3-alpine
    container_name: postgres-test
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: charge_station
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./src/test/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d charge_station"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis服务（如果网关未运行）
  redis-test:
    image: redis:7-alpine
    container_name: redis-test-station
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - standalone

  # Zookeeper服务（如果网关未运行）
  zookeeper-test:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-test-station
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - standalone

  # Kafka服务（如果网关未运行）
  kafka-test:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-test-station
    depends_on:
      zookeeper-test:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-test:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 1048576
      KAFKA_PROCESS_ROLES: ""
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka-test:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    profiles:
      - standalone

  # Kafka管理工具（可选，用于调试）
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-test
    depends_on:
      - kafka-test
    ports:
      - "8083:8083"
    environment:
      KAFKA_CLUSTERS_0_NAME: test-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-test:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-test:2181
    networks:
      - test-network
    profiles:
      - debug

  # Redis管理工具（可选，用于调试）
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander-test
    depends_on:
      - redis-test
    ports:
      - "8084:8081"
    environment:
      REDIS_HOSTS: "test:redis-test:6379"
    networks:
      - test-network
    profiles:
      - debug

  # pgAdmin（可选，用于调试PostgreSQL）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-test
    depends_on:
      - postgres-test
    ports:
      - "8085:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - test-network
    profiles:
      - debug

volumes:
  postgres-test-data:
    driver: local
  redis-test-data:
    driver: local
  pgadmin-data:
    driver: local

# 不定义网络，使用默认网络避免冲突
